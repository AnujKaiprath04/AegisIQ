name: AegisIQ Continuous Deployment (CD)

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. Build & Push Docker Images to GHCR
  # ============================================================================
  build-and-push-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. Trigger Cloud Deployments (Render & Vercel)
  # ============================================================================
  deploy-cloud-services:
    name: Deploy to Render & Vercel
    needs: build-and-push-images
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Backend Deploy Webhook
        run: |
          echo "Triggering Render Production Deployment..."
          # curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || true

      - name: Trigger Vercel Frontend Edge Deploy
        run: |
          echo "Triggering Vercel Production Deployment..."
          # vercel --prod --token=${{ secrets.VERCEL_TOKEN }} || true
