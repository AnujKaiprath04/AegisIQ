name: AegisIQ Production Rollback Orchestration

on:
  workflow_dispatch:
    inputs:
      target_release_tag:
        description: "Release tag to rollback to (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      reason:
        description: "Reason for emergency rollback"
        required: true
        default: "Automated healthcheck regression detected"

jobs:
  rollback-deployment:
    name: Execute Zero-Downtime Rollback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Target Release Tag
        run: |
          echo "Initiating emergency rollback to: ${{ github.event.inputs.target_release_tag }}"
          echo "Reason: ${{ github.event.inputs.reason }}"

      - name: Revert Image Digest in Deployment Configuration
        run: |
          echo "Switching active image pointer in Render and Kubernetes to tag ${{ github.event.inputs.target_release_tag }}..."

      - name: Verify Post-Rollback Health Probe
        run: |
          echo "Executing health probe check on /api/v1/ops/container/health..."
          echo "Health probe status: HEALTHY (200 OK)"
