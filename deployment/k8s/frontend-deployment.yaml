apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisiq-frontend
  namespace: aegisiq-prod
  labels:
    app: aegisiq-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegisiq-frontend
  template:
    metadata:
      labels:
        app: aegisiq-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: frontend
          image: ghcr.io/aegisiq/frontend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "https://api.aegisiq.enterprise"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: aegisiq-frontend-service
  namespace: aegisiq-prod
spec:
  type: ClusterIP
  selector:
    app: aegisiq-frontend
  ports:
    - port: 3000
      targetPort: 3000
      name: http
