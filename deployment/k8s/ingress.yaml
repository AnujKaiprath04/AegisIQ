apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegisiq-ingress
  namespace: aegisiq-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - app.aegisiq.enterprise
        - api.aegisiq.enterprise
      secretName: aegisiq-tls-secret
  rules:
    - host: app.aegisiq.enterprise
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aegisiq-frontend-service
                port:
                  number: 3000
    - host: api.aegisiq.enterprise
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aegisiq-backend-service
                port:
                  number: 8000
