# ==============================================================================
# AegisIQ Prometheus Metric Scraper Configuration
# Scrapes: FastAPI Backend (/metrics), PostgreSQL Exporter, Redis Exporter
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 1. AegisIQ FastAPI Core Application
  - job_name: "aegisiq-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          environment: "production"
          service: "core-api"

  # 2. PostgreSQL Metrics Exporter
  - job_name: "aegisiq-postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          environment: "production"
          service: "database"

  # 3. Redis Metrics Exporter
  - job_name: "aegisiq-redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          environment: "production"
          service: "cache"

  # 4. Host Node Exporter
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          environment: "production"
          service: "infrastructure"
