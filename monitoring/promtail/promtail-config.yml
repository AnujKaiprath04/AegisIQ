server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: aegisiq_app_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: aegisiq-backend
          environment: production
          __path__: /var/log/aegisiq/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            trace_id: trace_id
            span_id: span_id
      - labels:
          level:
          logger:
          trace_id:
